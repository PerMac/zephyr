CONFIG_SHELL=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_SHELL=y
CONFIG_CAN_SHELL_SCRIPTING_FRIENDLY=y

# Reliable shell UART output for pytest (avoid truncated async TX status lines)
CONFIG_SHELL_PRINTF_BUFF_SIZE=64
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=128
CONFIG_SHELL_BACKEND_SERIAL_FORCE_TX_BLOCKING_MODE=y
